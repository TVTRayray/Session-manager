summary: "Implemented persisted-state requirements for PRD-8 Phase 3: (1) Added Schema v3 migration logic in src/state.rs creating the `settings` table `(key TEXT PRIMARY KEY, value TEXT NOT NULL)` and bumping `user_version` to 3, supporting smooth upgrade from v0, v1, and v2 (both FTS5-enabled and disabled) while fully preserving existing records in `session_meta`, `index_meta`, and `session_content_fts`; (2) Implemented `StateStore::get_setting` and `StateStore::set_setting`, strictly returning `StateError::Degraded` when in-memory/degraded and returning permission/readonly error on read-only databases without crash; (3) Added `KEY_GROUP_BY = \"group_by\"` and deterministic mapping functions/methods between `GroupMode` and storage identifiers (`\"time\"`, `\"project\"`, `\"tag\"`) with safe fallback to `GroupMode::ByTime` on unrecognized/corrupted values; (4) Added `App::set_group_mode_and_persist` and wired `g` key handling to persist selection and warn on status line if operating in degraded/read-only mode; (5) Restored persisted `group_by` preference during app startup across both normal catalog load and fallback error branches; (6) Added comprehensive unit tests in `src/state.rs` and `src/app.rs` covering all migration paths, settings CRUD, degraded/read-only fallback, and startup restart recovery."
