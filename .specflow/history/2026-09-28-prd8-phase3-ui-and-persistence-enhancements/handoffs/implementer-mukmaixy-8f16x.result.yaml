summary: "Implemented canonical tui-interaction requirements for PRD-8 Phase 3: (1) Extracted shared header layout geometry and hitbox calculations (`compute_header_layout`, `HeaderLayout`, `HeaderHitbox`) between `src/tui.rs` and `src/app.rs`, preventing coordinate drift; (2) Implemented header row 0 mouse click handling for all 4 engines (Pi, OpenCode, Codex, Claude) with left/center/right boundary detection, clearing stale selection/detail/search context and dispatching catalog requests matching keyboard Tab behavior; (3) Added dynamic width collision protection: when terminal width >= threshold (88), right-hand Group-by buttons (`By Time | By Project | By Tag`) are rendered and clickable; when width < 88, right buttons are omitted and their hitboxes disabled to eliminate collision risks; (4) Added group-by mouse click persistence via `App::set_group_mode_and_persist`, updating grouping and writing to `state.db`; (5) Redesigned full-text search overlay into distinct card-based layout with horizontal dividers, prominent full-card selection background (`THEME_HEADER_BG`), bold indicators, and high-contrast yellow keyword highlight (`THEME_SEARCH_FG` on `THEME_SEARCH_BG`); (6) Verified full search overlay state matrix (empty query, loading, empty results, disabled FTS5, indexing progress, partial results, error messages) and wide CJK/Emoji safety under extreme narrow widths; (7) Added comprehensive unit tests and verified all quality gates."
